version: '3.8'

services:
  app:
    build: .
    container_name: healthcare-platform
    ports:
      - "8501:8501"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CHROMA_DB_PATH=/app/data/chroma_db
      - AUDIT_DB_PATH=/app/data/audit.db
      - LOG_LEVEL=INFO
    volumes:
      - chroma_data:/app/data/chroma_db
      - audit_data:/app/data
      - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - healthcare-network

  api:
    build: .
    container_name: healthcare-api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CHROMA_DB_PATH=/app/data/chroma_db
      - AUDIT_DB_PATH=/app/data/audit.db
    volumes:
      - chroma_data:/app/data/chroma_db
      - audit_data:/app/data
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - healthcare-network

  # Optional: Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: healthcare-prometheus
    volumes:
      - ./deployment/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    profiles:
      - monitoring
    networks:
      - healthcare-network

  grafana:
    image: grafana/grafana:latest
    container_name: healthcare-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployment/monitoring/grafana_dashboard.json:/etc/grafana/provisioning/dashboards/dashboard.json
    ports:
      - "3000:3000"
    profiles:
      - monitoring
    depends_on:
      - prometheus
    networks:
      - healthcare-network

volumes:
  chroma_data:
  audit_data:
  prometheus_data:
  grafana_data:

networks:
  healthcare-network:
    driver: bridge
